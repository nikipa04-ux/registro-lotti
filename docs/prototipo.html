<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Registro Lotti - Prototipo UI</title>
<style>
  /* Variabili di tema: cambiando questi colori si cambia tutto il look */
  :root {
    --bg: #f4f6f8; --card: #ffffff; --ink: #1f2937; --muted: #6b7280;
    --line: #e5e7eb; --brand: #0e7490; --brand-dark: #155e75;
    --red: #dc2626; --red-bg: #fef2f2; --amber: #d97706; --amber-bg: #fffbeb;
    --green: #16a34a; --green-bg: #f0fdf4;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); font-size: 14px; }
  .layout { display: flex; min-height: 100vh; }
  /* Colonna di navigazione sinistra */
  aside { width: 220px; background: #0f172a; color: #cbd5e1; padding: 16px 0; flex-shrink: 0; }
  .logo { color: #fff; font-weight: 700; font-size: 16px; padding: 0 20px 14px; border-bottom: 1px solid #1e293b; margin-bottom: 10px; }
  .logo small { display: block; font-weight: 400; font-size: 11px; color: #64748b; }
  nav button { display: block; width: 100%; text-align: left; background: none; border: none; color: #cbd5e1; padding: 10px 20px; font-size: 14px; cursor: pointer; }
  nav button:hover { background: #1e293b; color: #fff; }
  nav button.active { background: var(--brand); color: #fff; font-weight: 600; }
  /* Area contenuto principale */
  main { flex: 1; padding: 24px 32px; max-width: 1000px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 20px; font-size: 13px; }
  /* Card: contenitore bianco con bordo arrotondato usato ovunque */
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px; margin-bottom: 16px; }
  .card h2 { font-size: 14px; margin: 0 0 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-size: 11px; text-transform: uppercase; color: var(--muted); padding: 8px 10px; border-bottom: 1px solid var(--line); }
  td { padding: 10px; border-bottom: 1px solid #f3f4f6; vertical-align: top; }
  /* Riga cliccabile: evidenzia al passaggio del mouse */
  tr.click { cursor: pointer; }
  tr.click:hover { background: #f8fafc; }
  /* Badge: piccole etichette colorate */
  .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; }
  .b-red { background: var(--red-bg); color: var(--red); }
  .b-amber { background: var(--amber-bg); color: var(--amber); }
  .b-blue { background:#e0edff; color:#1d4ed8; }
  .b-green { background: var(--green-bg); color: var(--green); }
  .b-gray { background: #f1f5f9; color: var(--muted); }
  .mono { font-family: ui-monospace, monospace; font-size: 12.5px; }
  /* Pulsanti: primario pieno e secondario di contorno */
  .btn { background: var(--brand); color: #fff; border: none; border-radius: 8px; padding: 9px 16px; font-size: 14px; font-weight: 600; cursor: pointer; }
  .btn:hover { background: var(--brand-dark); }
  .btn.sec { background: #fff; color: var(--brand); border: 1px solid var(--brand); }
  .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; gap: 12px; flex-wrap: wrap; }
  input, select { padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; font-size: 14px; background: #fff; }
  input:focus, select:focus { outline: 2px solid var(--brand); outline-offset: -1px; }
  /* Statistiche della dashboard */
  .stats { display: flex; gap: 16px; margin-bottom: 16px; flex-wrap: wrap; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px 20px; min-width: 150px; }
  .stat .n { font-size: 26px; font-weight: 700; }
  .stat .l { color: var(--muted); font-size: 12px; }
  /* Griglie dei form: due colonne, .full occupa tutta la larghezza */
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .form-grid .full { grid-column: 1 / -1; }
  label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  label .req { color: var(--red); }
  label .opt { color: #9ca3af; font-weight: 400; }
  /* Riga con checkbox per selezionare i lotti da consumare */
  .check-row { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; margin-bottom: 6px; }
  .check-row.checked { background: #ecfeff; border-color: #a5f3fc; }
  /* Passi del wizard nuova produzione */
  .steps { display: flex; gap: 8px; margin-bottom: 16px; }
  .step { background: #e2e8f0; color: var(--muted); border-radius: 999px; padding: 4px 12px; font-size: 12px; font-weight: 600; }
  .step.on { background: var(--brand); color: #fff; }
  .hint { background: #eff6ff; border: 1px solid #bfdbfe; color: #1d4ed8; border-radius: 8px; padding: 10px 12px; font-size: 13px; margin-bottom: 16px; }
  .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  /* Intestazione card usata nelle anagrafiche: titolo a sinistra, azione a destra */
  .card-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .card-head h2 { margin: 0; display: flex; align-items: center; gap: 8px; }
  /* Lista scrollabile: la card resta compatta quando l'anagrafica si allunga.
     L'intestazione della tabella resta fissa in alto mentre si scorre. */
  .scroll-list { max-height: 320px; overflow-y: auto; border: 1px solid var(--line); border-radius: 8px; }
  .scroll-list table { margin: 0; }
  .scroll-list th { position: sticky; top: 0; background: #fff; z-index: 1; box-shadow: 0 1px 0 var(--line); }
  /* Coppia chiave/valore nella scheda dettaglio lotto */
  .kv { margin-bottom: 8px; }
  .kv .k { font-size: 11px; color: var(--muted); text-transform: uppercase; }
  .kv .v { font-size: 15px; font-weight: 600; }
  /* Combobox: campo di ricerca con tendina filtrata, usata al posto dei select
     lunghi (100+ ingredienti). Raggruppata per categoria, con "crea nuovo" inline. */
  .combo { position: relative; }
  .combo-dd { position: absolute; top: 100%; left: 0; right: 0; margin-top: 4px; background: #fff; border: 1px solid var(--line); border-radius: 8px; max-height: 240px; overflow-y: auto; z-index: 50; box-shadow: 0 4px 12px rgba(0,0,0,.08); }
  .combo-dd .cat { font-size: 10px; text-transform: uppercase; color: var(--muted); padding: 8px 12px 2px; }
  .combo-dd .it { padding: 8px 12px; cursor: pointer; display: flex; justify-content: space-between; gap: 8px; }
  .combo-dd .it:hover, .combo-dd .it.on { background: #ecfeff; }
  .combo-dd .it .sig { color: var(--muted); font-size: 11px; font-family: ui-monospace, monospace; }
  .combo-dd .new { padding: 10px 12px; cursor: pointer; color: var(--brand); font-weight: 600; border-top: 1px dashed var(--line); }
  .combo-dd .new:hover { background: #ecfeff; }
  .back { color: var(--brand); cursor: pointer; font-size: 13px; margin-bottom: 12px; display: inline-block; }
  .tag-type { font-size: 11px; }
</style>

// Nel backend vero nasce dalla tabella arrivi (ogni arrivo porta data+prezzo):
// qui è campionato per la demo. Serve ai grafici di andamento del food cost.
const STORICO = {
  1:  [["2026-05-05",2.90],["2026-06-10",3.05],["2026-08-03",3.05],["2026-10-02",3.20],["2026-11-08",3.20]], // uova

};
// Prezzo di un ingrediente alla data d: l'ultimo prezzo registrato ≤ d
function priceAt(pId, d) {
  const h = STORICO[pId];
  if (!h) return P(pId).costo;
  let v = h[0][1];
  for (const [dt, pu] of h) if (dt <= d) v = pu;
  return v;
}
// Food cost per unità del prodotto di una ricetta, calcolato alla data d
// (ricorsivo anche sui semilavorati, come il costo corrente)
function costoUnitaAt(pId, d) {
  const p = P(pId);
  if (p.tipo === "ingrediente") return priceAt(pId, d);
  const r = R(pId);
  if (!r) return p.costo || 0;
  return r.righe.reduce((s, l) => s + l.q * costoUnitaAt(l.p, d), 0) / r.resaN;
}

// FEFO (First Expired, First Out): assegnazione automatica dei lotti.
// Dato l'ingrediente e la quantità richiesta, riempie partendo dal lotto
// che scade prima (a parità, il più vecchio). È la logica HACCP corretta e
// scala a qualunque numero di lotti: l'operatore conferma, al massimo corregge.
function fefo(prodId, reqQ) {
  const lots = [
    ...ingressi.filter(a => a.prod === prodId && daysTo(a.scad) >= 0).map(a=>({...a, isIn:true})),
    ...interni.filter(a => a.prod === prodId && daysTo(a.scad) >= 0).map(a=>({...a, isIn:false}))
  ].sort((x,y) => x.scad === y.scad ? x.arrivo.localeCompare(y.arrivo) : x.scad.localeCompare(y.scad));
  let rem = reqQ; const asg = [];
  for (const c of lots) { if (rem <= 0) break; const take = Math.min(c.res, rem); asg.push({ c, take }); rem -= take; }
  return { asg, rem }; // rem > 0 = quantità non coperta dalle giacenze
}
// Stato della selezione lotti in nuova produzione: modalità manuale per riga
// e testo di ricerca typeahead (chiave: 'r'+ix righe ricetta, 'a'+i aggiunte)
let manualKeys = {}, lotSearch = {};
function togMan(k) { manualKeys[k] = !manualKeys[k]; render(); }
function setLotSearch(k, v) { lotSearch[k] = v; render(); keepFocus("ls-" + k); }
// Rendering condiviso della selezione lotti per una riga (FEFO + typeahead).
// Nel riepilogo FEFO si mostrano al massimo 2 lotti con checkbox: se la
// quantità richiede più lotti, il resto resta accessibile da "✏️ cambia lotti".
function renderLotti(prodId, reqQ, key) {
  const p = P(prodId);
  const { asg, rem } = fefo(prodId, reqQ);
  const vis = asg.slice(0, 2); // massimo 2 caselle visibili
  const extra = asg.length - vis.length;
  const chips = vis.map(x => '<div class="check-row checked" style="margin-bottom:4px">' +
    '<input type="checkbox" checked><div><span class="mono">' + x.c.lotto + '</span> <b>× ' + x.take + ' ' + p.um + '</b> ' + scadBadge(x.c.scad) +
    '<div style="font-size:11px;color:var(--muted)">' + (x.c.isIn ? F(x.c.forn).nome : "lotto interno") + '</div></div></div>').join("") +
    (extra > 0 ? '<div style="font-size:12px;color:var(--muted);margin:2px 0 4px">+ ' + extra + ' altro/i lotto/i (vedi "cambia lotti")</div>' : "");
  const warn = rem > 0 ? '<div class="hint" style="margin:6px 0 0;background:var(--red-bg);border-color:#fecaca;color:var(--red);padding:6px 10px;font-size:12px">⚠ Giacenze insufficienti: mancano ' + rem.toFixed(2).replace(".", ",") + ' ' + p.um + '</div>' : "";
  if (!manualKeys[key])
    return chips + warn +
      '<button class="btn sec" style="padding:2px 8px;font-size:11px;margin-top:4px" onclick="togMan(\'' + key + '\')">✏️ cambia lotti</button>';
  // Modalità manuale: typeahead sul codice + lista filtrata
  const t = (lotSearch[key] || "").toLowerCase();
  const all = [
    ...ingressi.filter(a => a.prod === prodId && daysTo(a.scad) >= 0).map(a=>({...a, isIn:true})),
    ...interni.filter(a => a.prod === prodId && daysTo(a.scad) >= 0).map(a=>({...a, isIn:false}))
  ].filter(c => !t || c.lotto.toLowerCase().includes(t));
  const list = all.map(c => { const isInAsg = asg.find(x => x.c.lotto === c.lotto);
    return '<div class="check-row' + (isInAsg ? " checked" : "") + '"><input type="checkbox" ' + (isInAsg ? "checked" : "") + '>' +
      '<div><span class="mono">' + c.lotto + '</span> · ' + c.res + ' ' + p.um + ' disp. ' + scadBadge(c.scad) +
      '<div style="font-size:11px;color:var(--muted)">' + (c.isIn ? F(c.forn).nome : "lotto interno") + '</div></div></div>'; }).join("");
  return chips + warn +
    '<input id="ls-' + key + '" placeholder="Cerca per codice lotto..." style="width:100%;margin:6px 0" value="' + (lotSearch[key] || "") + '" oninput="setLotSearch(\'' + key + '\', this.value)">' +
    (list || "<p style='color:var(--muted);font-size:12px'>Nessun lotto corrisponde alla ricerca</p>") +
    '<button class="btn sec" style="padding:2px 8px;font-size:11px;margin-top:4px" onclick="togMan(\'' + key + '\')">✓ Conferma selezione (FEFO)</button>';
}

// ETICHETTA CALCOLATA (opzione A: tutto dal verbale, nessuno snapshot).
// La lista ingredienti di un lotto interno si costruisce per RICORSIONE
// lungo i consumi. Accumulatore PER PRODOTTO DI ORIGINE: se uso crema
// (che contiene uova) E uova direttamente, le uova si FONDONO in una riga
// sola con quantità sommate — mai due voci "uova" in etichetta.
function ingLotto(lid, acc, factor) {
  acc = acc || {};
  const f = factor == null ? 1 : factor;
  consumi.filter(c => c.interno === lid).forEach(c => {
    if (c.orig === "ingresso") {
      const a = ingressi.find(x => x.id === c.from);
      acc[a.prod] = acc[a.prod] || { qta: 0, um: P(a.prod).um };
      acc[a.prod].qta += c.qta * f;
    } else {
      // Lotto interno consumato: si scala per la frazione usata.
      // Nel backend vero si divide per la quantità PRODOTTA del lotto
      // (colonna su lotti_interni); qui per la resa della sua ricetta.
      const src = interni.find(x => x.id === c.from);
      const resa = R(src.prod) ? R(src.prod).resaN : 1;
      ingLotto(c.from, acc, f * (c.qta / resa));
    }
  });
  return acc;
}
// UNICA funzione che produce denominazioni E allergeni dell'etichetta.
// La Q.TÀ NON si mostra (non serve in etichetta) ma si calcola lo stesso:
// per legge l'ordine degli ingredienti è decrescente di peso all'uso,
// quindi la quantità decide l'ordine delle righe.
function etichettaHtml(lid) {
  const acc = ingLotto(lid);
  const rows = Object.entries(acc).map(([pid, d]) => ({ p: P(+pid), qta: d.qta }))
    .sort((a, b) => b.qta - a.qta);
  const allSet = new Set();
  rows.forEach(r => allergeniDi(r.p.id).forEach(x => allSet.add(x)));
  const righe = rows.map(r =>
    '<tr><td><b>' + denomOf(r.p) + '</b></td><td>' +
    (allergeniDi(r.p.id).length ? allergeniDi(r.p.id).map(allergBadge).join("") : "") + '</td></tr>').join("");
  const contiene = allSet.size
    ? '<div style="margin-top:12px;font-weight:600;color:var(--red)">Contiene: ' +
      [...allSet].map(i => ALL[i][0]).sort().join(", ") + '</div>'
    : '<div style="margin-top:12px;color:var(--muted)">Nessun allergene dagli ingredienti usati.</div>';
  return '<table><tr><th>Ingrediente (denominazione legale)</th><th>Allergeni</th></tr>' + righe + '</table>' + contiene;
}

// Regola: gli INGREDIENTI li dichiarano (chips cliccabili in anagrafica);

// Nel backend: tabella allergeni + many-to-many con prodotti; sui lotti
// interni SNAPSHOT del calcolo al momento della produzione.
const ALL = [
  ["Glutine", "cereali contenenti glutine: grano, segale, orzo, avena, farro, kamut, ibridi e derivati"],
  ["Crostacei", "gamberi, scampi, aragoste, granchi (marini e d'acqua dolce) e derivati"],

  ["Molluschi", "cozze, vongole, ostriche, seppie, lumachine e derivati"],
];
// allergeni DICHIARATI per ingrediente (indici in ALL)
const ALLERG = {
  1: [2],          // uova pastorizzate
  3: [6],          // latte
  6: [0], 7: [0, 7], 8: [6], 9: [6], 10: [5, 6], 12: [11],
  14: [6], 19: [7], 21: [0, 6], 23: [0], 24: [0],
};
const allergBadge = i => '<span class="badge b-red" style="margin-right:3px" title="' + ALL[i][1] + '">⚠ ' + ALL[i][0] + '</span>';
// Allergeni di un prodotto: dichiarati per gli ingredienti, EREDITATI dalla
// ricetta per i prodotti di laboratorio (ricorsivo sui semilavorati)
function allergeniDi(pid) {
  if (ALLERG[pid]) return ALLERG[pid];
  const ric = ricette.find(r => r.prod === pid);
  if (ric) { const set = new Set(); ric.righe.forEach(l => allergeniDi(l.p).forEach(x => set.add(x))); return [...set]; }
  return [];
}
function togAllerg(pid, i) {
  ALLERG[pid] = ALLERG[pid] || [];
  const ix = ALLERG[pid].indexOf(i);
  if (ix >= 0) ALLERG[pid].splice(ix, 1); else ALLERG[pid].push(i);
  render();
}
// Categorie merceologiche: RIMOSSE (nov 2026, richiesta pasticcere).
// La tassonomia vera è: famiglie per i prodotti di laboratorio (anagrafiche),
// conservazione per gli ingredienti. Usate dal combobox per i gruppi.

// COMBOBOX riutilizzabile: campo con tendina filtrata per nome o sigla,
// raggruppata per categoria, con opzione "crea nuovo" inline.
// 'key' = chiave di stato; 'tipo' = "ingrediente" | "lavorati" (non ingredienti)
// | "riga" (ingredienti+semilavorati, per le righe di ricetta) | "fornitore".
// opts: { sel: id iniziale, onPick: nome fn(key,id), onQuery: nome fn(key,v) }
let comboState = {};
function setCQ(key, v) { comboState[key] = { ...(comboState[key]||{}), q: v, open: true }; render(); keepFocus("cb-" + key); }
function pickC(key, id) { comboState[key] = { q: "", sel: id, open: false }; render(); }
function toggleC(key) { comboState[key] = { ...(comboState[key]||{q:"",sel:0}), open: !(comboState[key]||{}).open }; render(); keepFocus("cb-" + key); }
function newC(key) { /* nel backend vero: apre la creazione rapida e riposiziona qui */ comboState[key] = { q: "", sel: 0, open: false }; render(); }
// Pick/query custom per le righe aggiunte in produzione: aggiornano agg[i]
function pickAgg(key, id) { const i = Number(key.slice(3)); agg[i] = { ...(agg[i]||{}), prod: id }; comboState[key] = { q: "", sel: id, open: false }; render(); }
function queryAgg(key, v) { comboState[key] = { ...(comboState[key]||{}), q: v, open: true }; render(); keepFocus("cb-" + key); }
function renderCombo(key, placeholder, tipo, opts) {
  opts = opts || {};
  const st = comboState[key] || { q: "", sel: opts.sel || 0, open: false };
  const q = (st.q || "").toLowerCase();
  const selName = st.sel ? (tipo === "fornitore" ? F(st.sel) : P(st.sel)) : null;
  const selNameStr = selName ? selName.nome : "";
  // Candidati secondo il tipo richiesto, ricerca per nome o sigla (o P. IVA per i fornitori)
  let pool = tipo === "fornitore" ? fornitori : prodotti.filter(p =>
    tipo === "ingrediente" ? p.tipo === "ingrediente" :
    tipo === "lavorati" ? p.tipo !== "ingrediente" :
    tipo === "riga" ? (p.tipo === "ingrediente" || p.tipo === "semilavorato") : true);
  let cand = pool.filter(x => !q || x.nome.toLowerCase().includes(q) ||
    (x.sigla && x.sigla.toLowerCase().includes(q)) || (x.piva && x.piva.toLowerCase().includes(q)));
  // Raggruppa la tendina secondo la tassonomia VERA dell'anagrafica:
  // prodotti di laboratorio per FAMIGLIA (gestita in anagrafiche),
  // ingredienti per CONSERVAZIONE (frigo/freezer/magazzino). Le vecchie
  // categorie merceologiche non esistono più.
  const groups = {};
  if (tipo === "fornitore") groups["Tutti i fornitori"] = cand;
  else cand.forEach(p => {
    const c = p.tipo !== "ingrediente"
      ? (PFAM[p.id] || "Senza famiglia")
      : "🧊 " + (CONS[p.id] || "Da sistemare");
    (groups[c] = groups[c] || []).push(p);
  });
  const onPick = opts.onPick || "pickC", onQuery = opts.onQuery || "setCQ";
  const dd = !st.open ? "" : '<div class="combo-dd">' +
    (q && !cand.some(x => x.nome.toLowerCase() === q) ? '<div class="new" onclick="newC(\'' + key + '\')">➕ Crea "' + st.q + '" (va in anagrafiche)</div>' : "") +
    Object.entries(groups).map(([c, ps]) =>
      '<div class="cat">' + c + '</div>' + ps.map(x =>
        '<div class="it' + (selNameStr && selNameStr === x.nome ? " on" : "") + '" onclick="' + onPick + '(\'' + key + '\',' + x.id + ')"><span>' + x.nome + '</span><span class="sig">' + (x.sigla || "") + '</span></div>'
      ).join("")
    ).join("") + (cand.length ? "" : '<div style="padding:10px 12px;color:var(--muted)">Nessun risultato</div>') +
    '</div>';
  return '<div class="combo">' +
    '<input id="cb-' + key + '" style="width:100%" placeholder="' + placeholder + '" value="' +
    (selNameStr ? selNameStr : (st.q || "")) + '" oninput="' + onQuery + '(\'' + key + '\', this.value)" onclick="toggleC(\'' + key + '\')">' +
    dd + '</div>';
}
// FOOD COST: costo per unità di misura di qualsiasi prodotto.
// Ingrediente → costo standard d'acquisto.
// Semilavorato/finale → CALCOLATO ricorsivamente dalla ricetta:
// (somma quantità×costo degli ingredienti) / resa. La crema costa quanto
// le sue uova+latte+zucchero, il bignè quanto la sua crema+burro.
const memoCosto = {}; // cache: evita ricalcoli su catene lunghe
function costoUnita(pId) {
  if (memoCosto[pId] !== undefined) return memoCosto[pId];
  const p = P(pId);
  let c = null;
  if (p.tipo === "ingrediente") {
    // Se ci sono arrivi recenti, il costo standard può corrispondere all'ultimo prezzo
    c = p.costo !== undefined ? p.costo : null;
  } else {
    const r = R(pId);
    if (r) {
      // Somma i costi delle righe e divide per la resa numerica
      const tot = r.righe.reduce((s,l) => s + l.q * costoUnita(l.p), 0);
      c = tot / r.resaN;
    } else if (p.costo !== undefined) {
      c = p.costo; // semilavorato senza ricetta: costo standard manuale
    }
  }
  memoCosto[pId] = c;
  return c;
}

// Scorciatoie per cercare anagrafiche per id
const P = id => prodotti.find(p => p.id === id);
const F = id => fornitori.find(f => f.id === id);

// Giorn che mancano alla scadenza rispetto alla "data corrente" simulata (12/11/2026)
// Nota: new Date("2026-11-15") è a mezzanotte UTC, quindi Math.round evita diff di ora
const daysTo = d => Math.round((new Date(d) - new Date("2026-11-12")) / 86400000);

// Genera il badge colorato della scadenza: rosso ≤3gg, ambra ≤7gg, verde oltre
const scadBadge = d => {
  const n = daysTo(d);
  if (n < 0) return '<span class="badge b-gray">scaduto</span>';
  if (n <= 3) return '<span class="badge b-red">' + d + ' · ' + n + 'g</span>';
  if (n <= 7) return '<span class="badge b-amber">' + d + ' · ' + n + 'g</span>';
  return '<span class="badge b-green">' + d + '</span>';
};

// Badge sintetico dei documenti di un arrivo: digitali, cartacei o nessuno
const allBadge = a => a.allegati.length ? '<span class="badge b-green" style="cursor:pointer" title="Clic: apre i documenti allegati" onclick="event.stopPropagation();apriDoc(' + a.id + ')">' + a.allegati.length + ' allegato/i</span>' : (a.cartaceo ? '<span class="badge b-gray">cartaceo</span>' : '<span class="badge b-gray">—</span>');
// Simulazione apertura documento: nel backend vero il clic chiama l'API locale
// che apre il file con l'app predefinita del sistema (os.startfile / xdg-open)
function apriDoc(id) { docMsg = "📄 Apertura documento... (nel backend: apre il file con l'app predefinita del PC)"; render(); }
let docMsg = null;

// Calcoli fiscali di un arrivo: totale = qta × prezzo unitario; con IVA = totale × (1 + iva/100)
const tot = a => (a.qta * a.pu);
const totIva = a => tot(a) * (1 + a.iva / 100);
const eur = n => n.toFixed(2).replace(".", ",") + " €";

      '<input id="fAnagP" placeholder="Cerca prodotto' + (filtriAnag.fam ? " (solo " + filtriAnag.fam + ')...' : "...") + '" style="width:100%;margin-bottom:10px" value="' + filtriAnag.pro + '" oninput="setFA(\'pro\',this.value)">' +
      wrap('<table><tr><th>Nome</th><th>Famiglia</th><th>Allergeni (da ricetta)</th><th>U.m.</th><th>Sigla</th></tr>' + (pr || empty(5)) + '</table>') + '</div>' +
      '<div class="card"><div class="card-head"><h2>🚚 Fornitori <span class="badge b-gray">' + fornitori.length + '</span></h2>' +
      '<button class="btn sec" style="padding:5px 10px;font-size:12px">+ Nuovo</button></div>' +
      '<input id="fAnagF" placeholder="Cerca fornitore..." style="width:100%;margin-bottom:10px" value="' + filtriAnag.for + '" oninput="setFA(\'for\',this.value)">' +
      wrapC('<table><tr><th>Nome</th><th>Arrivi</th></tr>' + (fr || empty(2)) + '</table>') + '</div>' +
      // Quarta card: le FAMIGLIE dei prodotti di laboratorio, gestibili qui
      // Card FAMIGLIE: stesso comportamento delle altre tre (pulsante
      // + Nuovo in testata, casella di ricerca, lista filtrabile, altezza
      // fissa come i Fornitori e scroll interno).
      '<div class="card"><div class="card-head"><h2>🏷 Famiglie <span class="badge b-gray">' + famiglie.length + '</span></h2>' +
      '<button class="btn sec" style="padding:5px 10px;font-size:12px" onclick="togFamNew()">+ Nuovo</button></div>' +
      (famMsg ? '<div class="hint" style="background:var(--red-bg);border-color:#fecaca;color:var(--red);margin-bottom:10px">' + famMsg + '</div>' : "") +
      '<input id="fAnagFam" placeholder="Cerca famiglia..." style="width:100%;margin-bottom:10px" value="' + filtriAnag.famT + '" oninput="setFA(\'famT\',this.value)">' +
      '<div class="scroll-list" style="height:342px;overflow-y:auto">' +
      (famNewOpen ? '<div class="check-row" style="border:none;padding:6px 0;align-items:center;background:var(--amber-bg)">' +
        '<input id="famNew" placeholder="Nome della nuova famiglia..." style="flex:1" value="' + famNew + '" oninput="setFamNew(this.value)">' +
        '<button class="btn" style="padding:5px 10px;font-size:12px" onclick="addFam()">+ Aggiungi</button>' +
        '<button class="btn sec" style="padding:5px 10px;font-size:12px" onclick="togFamNew()">Annulla</button></div>' : "") +
      famiglie.map((f, i) => ({ f, i }))
        .filter(x => !filtriAnag.famT || x.f.toLowerCase().includes(filtriAnag.famT.toLowerCase()))
        .map(({ f, i }) => {
        const nProd = prodotti.filter(p => PFAM[p.id] === f).length;
        return famEdit === i
          ? '<div class="check-row" style="border:none;padding:6px 0"><input id="famEdit" value="' + f + '" style="flex:1" oninput="famEditVal=this.value">' +
            '<button class="btn" style="padding:5px 10px;font-size:12px" onclick="saveFam(' + i + ', document.getElementById(\'famEdit\').value)">Salva</button>' +
            '<button class="btn sec" style="padding:5px 10px;font-size:12px" onclick="setFamEdit(null)">Annulla</button></div>'
          : '<div class="check-row" style="border:none;padding:6px 0;align-items:center">' +
            '<span class="click" onclick="setFamEdit(' + i + ')" style="flex:1"><b>' + f + '</b> <span style="color:var(--muted);font-size:11px">✏️</span></span>' +
            '<span class="badge b-gray" style="cursor:pointer" data-f="' + f + '" title="Clic: mostra i prodotti di questa famiglia" onclick="event.stopPropagation();setFamFilt(this.dataset.f)">' + nProd + (nProd === 1 ? " prodotto" : " prodotti") + '</span>' +
            '<button class="btn sec" style="padding:2px 6px;font-size:11px;color:var(--red);border-color:var(--red)" onclick="delFam(' + i + ')" title="Elimina famiglia (solo se non usata)">✕</button></div>';
      }).join("") +
      '</div>' +
      '<div class="hint" style="margin:10px 0 0">Le famiglie si usano in ricette e produzioni. Rinominare qui aggiorna ovunque; eliminare è possibile solo se nessun prodotto la usa.</div></div>' +
      '</div>';
  }},

  // Scheda di modifica di un'anagrafica: kind 'p' = prodotto/ingrediente, 'f' = fornitore
  anagrafica: { label: null, render: (_, kind, id) => {
    const back = () => 'go(\'anagrafiche\')';
    if (kind === "f") {
      // ---- Scheda fornitore: dati fiscali e contatti ----
      const f = fornitori.find(x=>x.id==id);
      if (!f) return "<p>Fornitore non trovato</p>";
      return '<span class="back" onclick="' + back() + '">← Torna alle anagrafiche</span>' +
        '<h1>' + f.nome + '</h1><p class="sub">Scheda fornitore</p>' +
        '<div class="card"><div class="form-grid">' +
        '<div><label>Ragione sociale <span class="req">*</span></label><input value="' + f.nome + '"></div>' +
        '<div><label>Partita IVA</label><input value="' + f.piva + '" class="mono"></div>' +
        '<div><label>Telefono</label><input value="' + f.tel + '"></div>' +
        '<div><label>Email</label><input value="' + f.email + '"></div>' +
        '<div class="full"><label>Note</label><input value="' + f.note + '"></div>' +
        '</div></div>' +
        '<div class="card"><h2>Arrivi recenti da questo fornitore</h2><table>' +
        '<tr><th>Prodotto</th><th>Lotto</th><th>Arrivo</th><th>Scadenza</th><th style="text-align:right">Totale + IVA</th></tr>' +
        ingressi.filter(i=>i.forn===f.id).map(a=>'<tr class="click" onclick="go(\'dettaglio\',\'i\',' + a.id + ')"><td><b>' + P(a.prod).nome + '</b></td><td class="mono">' + a.lotto + '</td><td>' + a.arrivo + '</td><td>' + scadBadge(a.scad) + '</td><td style="text-align:right"><b>' + eur(totIva(a)) + '</b></td></tr>').join("") +
        '</table></div>' +
        '<button class="btn" onclick="' + back() + '">Salva modifiche</button> ' +
        '<button class="btn sec" onclick="' + back() + '">Annulla</button>';
    }
    // ---- Scheda prodotto/ingrediente ----
    const p = prodotti.find(x=>x.id==id);
    if (!p) return "<p>Prodotto non trovato</p>";
    const isIngr = p.tipo === "ingrediente";
    return '<span class="back" onclick="' + back() + '">← Torna alle anagrafiche</span>' +
      '<h1>' + p.nome + ' ' + (isIngr ? '<span class="badge b-gray tag-type">ingrediente</span>' : famBadge(p)) + '</h1>' +
      '<p class="sub">Scheda ' + (isIngr ? "ingrediente" : "prodotto") + '</p>' +
      '<div class="card"><div class="form-grid">' +
      '<div><label>Nome <span class="req">*</span></label><input value="' + p.nome + '"></div>' +
      (isIngr
        ? '<div><label>Denominazione legale <span class="req">*</span></label><input value="' + denomOf(p) + '" title="La dicitura esatta dell\'etichetta d\'acquisto: finisce nell\'etichetta dei prodotti finiti"><div class="hint" style="margin-top:6px">Precompilata dal nome: è la dicitura dell\'etichetta d\'acquisto (es. farina 00 → «Farina di grano tenero tipo 00»).</div></div>'
        : "") +
      '<div><label>Marca / Produttore' + (isIngr ? ' <span class="req">*</span>' : '') + '</label><input value="' + (isIngr ? (MARCA[p.id] || "") : "") + '" placeholder="' + (isIngr ? "es. Molino Chiari" : "in produzione interna") + '"' + (isIngr ? "" : " disabled") + '></div>' +
      (!isIngr ? '<div><label>Famiglia <span class="req">*</span></label>' + renderFamSel("an" + p.id, PFAM[p.id]) + '</div>' : "") +
      (isIngr
        ? '<div class="full"><label>Allergeni <span style="font-weight:400;color:var(--muted)">(clic per attivare/disattivare)</span></label><div style="display:flex;flex-wrap:wrap;gap:4px">' +
          ALL.map((a, i) => {
            const on = (ALLERG[p.id] || []).includes(i);
            return '<span class="badge ' + (on ? "b-red" : "b-gray") + '" style="cursor:pointer" title="' + a[1] + '" onclick="togAllerg(' + p.id + ',' + i + ')">' + (on ? "⚠ " : "") + a[0] + '</span>';
          }).join("") + '</div>' +
          '<div class="hint" style="margin-top:8px">I 14 allergeni obbligatori da etichetta (Reg. UE 1169/2011). I prodotti di laboratorio li ereditano automaticamente dalla ricetta.</div></div>'
        : '<div class="full"><label>Allergeni (ereditati dalla ricetta)</label><div style="display:flex;flex-wrap:wrap;gap:4px">' +
          (allergeniDi(p.id).length ? allergeniDi(p.id).map(allergBadge).join("") : '<span style="color:var(--muted)">nessun allergene dalla ricetta attuale</span>') +
          '</div><div class="hint" style="margin-top:8px">Calcolati dagli ingredienti della ricetta: se cambia la ricetta, cambiano qui. Non si editano a mano.</div></div>') +
      (isIngr
        ? '<div><label>Conservazione <span class="req">*</span></label><select style="width:100%">' + CONS_LIST.map(c=>'<option' + (c === CONS[p.id] ? " selected" : "") + '>' + (CONS_ICON[c] || "") + " " + c + '</option>').join("") + '</select></div>'
        : "") +
      '<div><label>Unità di misura</label><input value="' + p.um + '"></div>' +
      '<div><label>Sigla (per codice lotto interno)</label><input value="' + p.sigla + '" class="mono"></div>' +
      '<div class="full"><label>Note</label><input value="' + p.note + '"></div>' +
      '</div></div>' +
      (isIngr
        ? '<div class="card"><h2>Arrivi recenti di questo ingrediente</h2>' +
          '<div class="scroll-list"><table>' +
          '<tr><th>Lotto</th><th>Fornitore</th><th>Arrivo</th><th>Scadenza</th><th>Q.tà</th><th style="text-align:right">Prezzo unit.</th><th style="text-align:right">Totale</th><th style="text-align:right">IVA</th><th style="text-align:right">Totale + IVA</th><th>Documenti</th></tr>' +
          (ingressi.filter(i=>i.prod===p.id).map(a=>'<tr class="click" onclick="go(\'dettaglio\',\'i\',' + a.id + ')"><td class="mono">' + a.lotto + '</td><td>' + F(a.forn).nome + '</td><td>' + a.arrivo + '</td><td>' + scadBadge(a.scad) + '</td><td>' + a.qta + ' ' + p.um + '</td><td style="text-align:right">' + eur(a.pu) + '</td><td style="text-align:right">' + eur(tot(a)) + '</td><td style="text-align:right"><span class="badge b-gray">' + a.iva + '%</span></td><td style="text-align:right"><b>' + eur(totIva(a)) + '</b></td><td>' + allBadge(a) + '</td></tr>').join("") || '<tr><td colspan=10 style="color:var(--muted)">Nessun arrivo registrato</td></tr>') +
          '</table></div></div>'
        : '<div class="card"><h2>Produzioni recenti di questo prodotto</h2><table>' +
          '<tr><th>Lotto interno</th><th>Data produzione</th><th>Scadenza</th></tr>' +
          interni.filter(i=>i.prod===p.id).map(a=>'<tr class="click" onclick="go(\'dettaglio\',\'n\',' + a.id + ')"><td class="mono">' + a.lotto + '</td><td>' + a.prodData + '</td><td>' + scadBadge(a.scad) + '</td></tr>').join("") +
          '</table></div>') +
      '<button class="btn" onclick="' + back() + '">Salva modifiche</button> ' +
      '<button class="btn sec" onclick="' + back() + '">Annulla</button>';
  }},

  // Vista Magazzino: giacenze, ritmo di consumo e previsione dei rifornimenti.
  // Tutti i valori sono CALCOLATI dai dati già registrati (arrivi + consumi),
  // non inseriti a mano: è il vantaggio di avere la tracciabilità.
  // Vista Ricette: l'elenco delle composizioni dei prodotti interni.
  // Selezionando un prodotto in produzione l'app usa la ricetta per
  // proporre automaticamente i lotti da consumare (tracciabilità automatica).
  ricette: { label: "👩‍🍳 Ricette", render: () => {
    const t = filtriRic.testo.toLowerCase();
    const list = ricette.filter(r => !t || P(r.prod).nome.toLowerCase().includes(t));
    const rows = list.map(r => { const cu = costoUnita(r.prod);
      return '<tr class="click" onclick="go(\'ricetta\',' + r.id + ')">' +
      '<td><b>' + P(r.prod).nome + '</b></td><td>' + r.resa + '</td><td>' + r.righe.length + ' ingredienti</td>' +
      '<td style="text-align:right"><b>' + (cu !== null ? eur(cu) + '/' + P(r.prod).um : "—") + '</b></td>' +
      '<td><span class="badge b-amber">' + r.fam + '</span></td></tr>'; }).join("");
    return '<h1>Ricette</h1><p class="sub">Composizione e food cost dei prodotti: rendono automatica la selezione dei lotti in produzione</p>' +
      '<div class="toolbar"><input id="fRic" placeholder="Cerca ricetta..." style="min-width:240px" value="' + filtriRic.testo + '" oninput="setFR(this.value)">' +
      '<button class="btn" onclick="go(\'nuovaRicetta\')">+ Nuova ricetta</button></div>' +
      '<div class="card"><table><tr><th>Prodotto</th><th>Resa per dose</th><th>Ingredienti</th><th style="text-align:right">Food cost/ud</th><th>Famiglia</th></tr>' +
      (rows || "<tr><td colspan=4 style='color:var(--muted)'>Nessuna ricetta corrisponde</td></tr>") + '</table></div>' +
      '<div class="hint">Prodotti senza ricetta: ' + prodotti.filter(p=>p.tipo!=="ingrediente" && !R(p.id)).map(p=>p.nome).join(", ") + '</div>';
  }},

  // Scheda ricetta: composizione completa, cliccabile sulle anagrafiche.
  // CALCOLATORE DI RESA: si inserisce la resa desiderata e tutte le
  // quantità degli ingredienti scalano proporzionalmente (fattore = resa/resaN).
  ricetta: { label: null, render: (_, id) => {
    const r = ricette.find(x=>x.id==id);
    if (!r) return "<p>Ricetta non trovata</p>";
    // Resa desiderata: se vuota o non valida, si usa la dose base (fattore 1)
    const target = parseFloat((resaTarget[id] || "").replace(",", "."));
    const fattore = (!isNaN(target) && target > 0) ? target / r.resaN : 1;
    const attiva = fattore !== 1;
    const fmt = q => (q * fattore).toFixed(fattore === 1 ? 1 : 2).replace(".", ",");
    const rows = r.righe.map(l => {
      const cu = costoUnita(l.p); // costo per unità dell'ingrediente (ricorsivo per semilavorati)
      const costoRiga = cu !== null ? cu * l.q * fattore : null;
      return '<tr class="click" onclick="go(\'anagrafica\',\'p\',' + l.p + ')">' +
      '<td><b>' + P(l.p).nome + '</b>' +
      (P(l.p).tipo !== "ingrediente" ? ' ' + famBadge(P(l.p)) : '') +
      '</td><td style="text-align:right">' + fmt(l.q) + ' ' + P(l.p).um + '</td>' +
      '<td style="text-align:right">' + (cu !== null ? eur(cu / (fattore === 1 ? 1 : 1)) + '/' + P(l.p).um : "—") + '</td>' +
      '<td style="text-align:right"><b>' + (costoRiga !== null ? eur(costoRiga) : "—") + '</b></td></tr>';
    }).join("");
    // Totale food cost della dose (attuale o riscalata) e per unità di prodotto
    const totDose = r.righe.reduce((s,l) => { const cu = costoUnita(l.p); return cu !== null ? s + cu * l.q * fattore : s; }, 0);
    const resaAttuale = r.resaN * fattore;
    return '<span class="back" onclick="go(\'ricette\')">← Torna alle ricette</span>' +
      '<h1>' + P(r.prod).nome + '</h1><p class="sub">Ricetta · <span class="badge b-amber">' + r.fam + '</span> · resa base: <b>' + r.resa + '</b></p>' +
      '<div class="card"><h2>🧮 Calcolatore resa</h2>' +
      '<div class="toolbar" style="margin-bottom:0">' +
      '<label style="margin:0">Resa desiderata</label>' +
      '<input id="fResa" placeholder="' + r.resaN + '" style="width:100px" value="' + (resaTarget[id] || "") + '" oninput="setResa(' + id + ', this.value)"> ' + r.resaUm +
      '<span class="badge ' + (attiva ? 'b-amber' : 'b-gray') + '">' +
      (attiva ? 'dose × ' + fattore.toFixed(2).replace(".", ",") : 'dose base') + '</span>' +
      (attiva ? '<button class="btn sec" style="padding:5px 10px;font-size:12px" onclick="setResa(' + id + ', \'\')">↺ Ripristina dose base</button>' : '') +
      '</div>' +
      (attiva ? '<div class="hint" style="margin:12px 0 0">Quantità aggiornate per una resa di <b>' + (resaTarget[id] || target) + ' ' + r.resaUm + '</b></div>' : '') +
      '</div>' +
      '<div class="detail-grid" style="margin-top:16px">' +
      '<div class="card"><h2>🧾 Composizione e food cost</h2>' +
      '<div class="scroll-list"><table><tr><th>Ingrediente</th><th style="text-align:right">Quantità' + (attiva ? ' (ricalcolata)' : '') + '</th><th style="text-align:right">Costo/u.m.</th><th style="text-align:right">Costo riga</th></tr>' + rows + '</table></div>' +
      '<div class="hint" style="margin:12px 0 0">Le righe in ambra sono semilavorati: il loro costo/u.m. è a sua volta calcolato dalla loro ricetta (catena ricorsiva).</div></div>' +
      '<div class="card"><h2>💰 Food cost</h2>' +
      '<div class="kv"><div class="k">Costo totale della dose' + (attiva ? ' (ricalcolato)' : '') + '</div><div class="v">' + eur(totDose) + '</div></div>' +
      '<div class="kv"><div class="k">Costo per ' + r.resaUm + ' di prodotto</div><div class="v">' + eur(totDose / resaAttuale) + '</div></div>' +
      '<div class="kv"><div class="k">Esempio: prezzo di vendita a food cost 30%</div><div class="v">' + eur(totDose / resaAttuale / 0.3) + ' / ' + r.resaUm + '</div></div>' +
      '<div class="hint" style="margin:12px 0 0">Semplice indicatore: il costo degli ingredienti. Non include manodopera, energia e sprechi.</div>' +
      '<button class="btn sec" style="margin-top:12px;width:100%" onclick="go(\'analisiFC\',' + r.id + ')">📈 Analisi food cost nel tempo</button></div>' +
      '<div class="card"><h2>⚙️ Parametri</h2>' +
      '<div class="kv"><div class="k">Prodotto ottenuto</div><div class="v">' + P(r.prod).nome + '</div></div>' +
      '<div class="kv"><div class="k">Famiglia</div><div class="v"><span class="badge b-amber">' + r.fam + '</span></div></div>' +
      '<div class="kv"><div class="k">Resa per dose</div><div class="v">' + (attiva ? resaTarget[id] + ' ' + r.resaUm : r.resa) + '</div></div>' +
      '<div class="kv"><div class="k">Scadenza consigliata</div><div class="v">da definire in v0.2 (shelf-life per prodotto)</div></div>' +
      '<button class="btn sec" style="margin-top:10px"' + (attiva ? ' disabled title="Disponibile in v0.2: produzione con dose riscalata"' : ' onclick="go(\'nuovaProduzione\')"') + '>🥣 Avvia produzione con questa ricetta</button>' +
      ' <button class="btn sec" style="margin-top:10px" onclick="go(\'modificaRicetta\',' + r.id + ')">✏️ Modifica ricetta</button>' +
      '</div></div>' +
      (r.note ? '<div class="card" style="margin-top:16px"><h2>📝 Note e procedimento</h2><div style="white-space:pre-wrap;line-height:1.6">' + r.note + '</div></div>' : '') +
      '</div>';
  }},

  // Scheda di modifica ricetta: si può cambiare resa e unità di misura,
  // correggere le quantità, sostituire o togliere ingredienti.
  // Nuova ricetta: come la modifica ma vuota. Il prodotto ottenuto si sceglie
  // col combobox (che offre "crea nuovo" se non esiste ancora in anagrafica),
  // le righe si aggiungono una a una e ognuna ha la sua ✕.
  nuovaRicetta: { label: null, render: () => {
    const righe = nrRows.map((r, i) =>
      '<div class="check-row" style="align-items:center">' +
      '<div style="flex:1">' + renderCombo("nr-r" + i, "Cerca ingrediente o semilavorato...", "riga", { sel: r.prod, onPick: "pickNr", onQuery: "queryNr" }) + '</div>' +
      '<input placeholder="0" style="width:80px;text-align:right" title="quantità">' +
      '<span style="color:var(--muted);font-size:12px;min-width:20px">' + (r.prod ? P(r.prod).um : "") + '</span>' +
      '<button class="btn sec" style="padding:4px 8px;font-size:12px;color:var(--red);border-color:var(--red)" onclick="remNrRow(' + i + ')" title="Rimuovi riga">✕</button>' +
      '</div>').join("");
    return '<span class="back" onclick="go(\'ricette\')">← Torna alle ricette</span>' +
      '<h1>Nuova ricetta</h1><p class="sub">Definisce la composizione di un prodotto: la userà il food cost e la selezione automatica dei lotti in produzione</p>' +
      '<div class="card"><div class="form-grid">' +
      '<div><label>Prodotto ottenuto <span class="req">*</span></label>' + renderCombo("nr-prod", "Cerca prodotto (o creane uno nuovo)...", "lavorati") + '</div>' +
      '<div><label>Famiglia <span class="req">*</span></label>' + renderFamSel("nrf", "Creme") + '</div>' +
      '<div><label>Resa base <span class="req">*</span></label><div style="display:flex;gap:8px">' +
      '<input placeholder="es. 1,2" style="width:100px">' +
      renderUmResa(null) + '</div></div>' +
      '</div></div>' +
      '<div class="card"><div class="card-head"><h2>🧾 Righe della ricetta</h2>' +
      '<button class="btn sec" style="padding:5px 10px;font-size:12px" onclick="addNrRow()">+ Aggiungi ingrediente</button></div>' +
      righe +
      '<div class="hint" style="margin:12px 0 0">Le dosi sono espresse per resa completa: il calcolatore le riscalerà su richiesta. L\'u.m. di ogni riga è quella dell\'ingrediente scelto.</div>' +
      '</div>' +
      // Il procedimento sta in fondo, come ultima cosa prima del salvataggio:
      // è un testo lungo e qui ha tutto lo spazio che serve (textarea, non input).
      '<div class="card"><div class="card-head"><h2>📝 Note e procedimento</h2></div>' +

  magazzino: { label: "📦 Magazzino", render: () => {
    const t = filtriMag.testo.toLowerCase();
    // Statistiche per ogni ingrediente acquistato
    const stats = prodotti.filter(p=>p.tipo==="ingrediente").map(p => {
      const arrivi = ingressi.filter(a=>a.prod===p.id);
      // Giacenza attuale: somma delle quantità residue dei lotti non scaduti
      const stock = arrivi.filter(a=>daysTo(a.scad)>=0).reduce((s,a)=>s+a.res,0);
      // Consumo totale dal primo arrivo a oggi (pesca i consumi dei lotti di questo prodotto)
      const consumato = arrivi.reduce((s,a)=>s + consumi.filter(c=>c.orig==="ingresso"&&c.from===a.id).reduce((x,c)=>x+c.qta,0),0);
      // Consumo medio giornaliero: dividendo per i giorni trascorsi dal primo arrivo
      const giorni = Math.max(1, daysTo("2026-11-12") - daysTo(arrivi[0] ? arrivi[0].arrivo : "2026-11-12"));
      const perGiorno = consumato / giorni;
      // Copertura: quanti giorni di lavoro copre la giacenza attuale
      const copertura = perGiorno > 0 ? stock / perGiorno : Infinity;
      // Intervallo medio tra i rifornimenti osservati (per suggerire quando riordinare)
      const date = arrivi.map(a=>a.arrivo).sort();
      const intervalli = date.slice(1).map((d,i)=>Math.abs(new Date(d)-new Date(date[i]))/86400000);
      const intervallo = intervalli.length ? Math.round(intervalli.reduce((s,x)=>s+x,0)/intervalli.length) : null;
      const ultimo = date[date.length-1];
      const prossimo = intervallo ? new Date(new Date(ultimo).getTime() + intervallo*86400000).toISOString().slice(0,10) : null;
      // Giacenze PER MARCA: stesso ingrediente può avere più marche in casa
      // (es. farina Molino Chiari + Molino Biolatti). Le righe figlie nel
      // magazzino mostrano questa divisione.
      const perMarca = {};
      arrivi.filter(a=>daysTo(a.scad)>=0).forEach(a => {
        const m = brandOf(a) || "—";
        perMarca[m] = perMarca[m] || { stock: 0, lotti: 0 };
        perMarca[m].stock += a.res; perMarca[m].lotti++;
      });
      return { p, stock, perGiorno, copertura, intervallo, ultimo, prossimo, nArrivi: arrivi.length, perMarca };
    });
    const copBadge = c => c < 3 ? '<span class="badge b-red">critico · ' + (c===Infinity?"∞":Math.round(c)) + 'g</span>'
      : c < 7 ? '<span class="badge b-amber">' + Math.round(c) + 'g</span>'
      : '<span class="badge b-green">' + Math.round(c) + 'g</span>';
    // Riga aggregata per ingrediente +, se ci sono più marche, una riga figlia
    // per marca (indentata, muta): la giacenza si divide per marca.
    const rows = stats.filter(s=>!t || s.p.nome.toLowerCase().includes(t)).filter(s=>!filtriMag.cons || CONS[s.p.id] === filtriMag.cons).map(s =>
      '<tr><td><b>' + s.p.nome + '</b> ' + consBadge(CONS[s.p.id]) + '</td><td><b>' + s.stock + '</b> ' + s.p.um + '</td>' +
      '<td>' + (s.perGiorno ? s.perGiorno.toFixed(1) + ' ' + s.p.um + '/g' : "—") + '</td>' +
      '<td>' + (s.perGiorno ? copBadge(s.copertura) : '<span class="badge b-gray">no dati</span>') + '</td>' +
      '<td>' + s.nArrivi + '</td>' +
      '<td>' + (s.intervallo ? '≈ ogni ' + s.intervallo + 'g' : "—") + '</td>' +
      '<td>' + s.ultimo + '</td>' +
      '<td>' + (s.prossimo ? (s.prossimo <= "2026-11-12" ? '<span class="badge b-amber">atteso: ' + s.prossimo + '</span>' : s.prossimo) : "—") + '</td></tr>' +
      (Object.keys(s.perMarca).length > 1
        ? Object.entries(s.perMarca).map(([m, d]) =>
            '<tr style="color:var(--muted)"><td style="padding-left:22px">└ 🏷 ' + m + '</td><td>' + d.stock + ' ' + s.p.um + '</td><td colspan="6">' + d.lotti + (d.lotti === 1 ? " lotto" : " lotti") + '</td></tr>').join("")
        : "")).join("");
    return '<h1>Magazzino</h1><p class="sub">Giacenze e ritmo di consumo calcolati dagli arrivi e dalle produzioni registrate · gli ingredienti con più marche si dividono in righe figlie 🏷</p>' +
      '<div class="toolbar"><input id="fMag" placeholder="Cerca ingrediente..." style="min-width:240px" value="' + filtriMag.testo + '" oninput="setFM(this.value)">' +
      // Chip di conservazione: dividono il magazzino per luogo fisico
      CONS_LIST.map(c => '<button class="btn' + (filtriMag.cons === c ? "" : " sec") + '" style="padding:6px 12px;font-size:12px" onclick="setConsFM(\'' + c + '\')">' + CONS_ICON[c] + " " + c + ' <span class="badge b-gray">' + ingressi.filter(a=>CONS[a.prod]===c).length + '</span></button>').join("") +
      (filtriMag.cons ? '<button class="btn sec" style="padding:6px 12px;font-size:12px;color:var(--red);border-color:var(--red)" onclick="setConsFM(null)">✕ ' + filtriMag.cons + '</button>' : "") +
      '<button class="btn sec">📄 Esporta elenco (.xlsx)</button></div>' +
      '<div class="card"><h2>⚠️ Da ordinare</h2>' +
      '<table><tr><th>Ingrediente</th><th>Giacenza</th><th>Copertura</th></tr>' +
      stats.filter(s=>s.perGiorno>0 && s.copertura<5 && (!filtriMag.cons || CONS[s.p.id]===filtriMag.cons)).map(s=>'<tr class="click" onclick="go(\'arrivi\')"><td><b>' + s.p.nome + '</b></td><td>' + s.stock + ' ' + s.p.um + '</td><td>' + copBadge(s.copertura) + '</td></tr>').join("") +
      '</table></div>' +
      '<div class="card"><h2>📦 Giacenze e rifornimenti</h2>' +
      '<table><tr><th>Ingrediente</th><th>Giacenza</th><th>Consumo medio</th><th>Copertura</th><th>Arrivi</th><th>Cadenza rifornimenti</th><th>Ultimo arrivo</th><th>Prossimo atteso</th></tr>' +
      (rows || "<tr><td colspan=8 style='color:var(--muted)'>Nessun ingrediente corrisponde</td></tr>") + '</table></div>';
  }},

  // Analisi food cost di una ricetta: pagina aperta dalla scheda ricetta.
  // Due grafici SVG disegnati dal codice (nessuna libreria):
  // 1) linea: andamento del costo unitario nel tempo (dallo storico prezzi)
  // 2) torta: peso di ogni ingrediente sul costo attuale
  analisiFC: { label: null, render: (_, id) => {
    const r = ricette.find(x=>x.id==id);
    if (!r) return "<p>Ricetta non trovata</p>";
    const p = P(r.prod);
    // ---- 1) serie temporale: per ogni data nello storico degli ingredienti,
    // il costo unitario del prodotto ricalcolato con i prezzi di quel giorno
    const date = [...new Set(r.righe.flatMap(l => (STORICO[l.p] || []).map(x => x[0])))].sort();
    if (date.length) date.push("2026-11-12"); // oggi
    const serie = date.map(d => ({ d, v: costoUnitaAt(r.prod, d) }));
    const vs = serie.map(s=>s.v), vmin = Math.min(...vs), vmax = Math.max(...vs);
    const W = 560, H = 220, PAD = 36;
    const x = i => PAD + (i / Math.max(1, serie.length - 1)) * (W - 2*PAD);
    const y = v => H - PAD - ((v - vmin) / Math.max(0.01, vmax - vmin)) * (H - 2*PAD - 10);
    const pts = serie.map((s,i) => x(i).toFixed(1) + "," + y(s.v).toFixed(1)).join(" ");
    const dots = serie.map((s,i) => '<circle cx="' + x(i).toFixed(1) + '" cy="' + y(s.v).toFixed(1) + '" r="3.5" fill="var(--brand)"><title>' + s.d + ': ' + eur(s.v) + '/' + p.um + '</title></circle>').join("");
    // ---- 2) torta: incidenza attuale di ogni riga sul costo totale
    const PAL = ["#0e7490","#d97706","#16a34a","#9333ea","#dc2626","#0891b2","#ca8a04","#7c3aed"];
    const valori = r.righe.map(l => ({ nome: P(l.p).nome, v: l.q * (costoUnita(l.p) || 0), um: P(l.p).um }));
    const totPie = valori.reduce((s,x) => s + x.v, 0) || 1;
    let ang0 = -Math.PI/2;
    const arcs = valori.map((x, i) => {
      const frac = x.v / totPie, ang1 = ang0 + frac * 2*Math.PI;
      const cx=90, cy=90, RR=70;
      // Fetta piena: centro → arco esterno → chiusura (Z).
      // Se una voce è al 100% l'arco degenere: si disegna un cerchio pieno.
      let path;
      if (frac >= 0.999) {
        path = '<circle cx="' + cx + '" cy="' + cy + '" r="' + RR + '" fill="' + PAL[i % PAL.length] + '" opacity="0.85"><title>' + x.nome + ': ' + (frac*100).toFixed(1).replace(".", ",") + '%</title></circle>';
      } else {
        const x0 = cx + RR*Math.cos(ang0), y0 = cy + RR*Math.sin(ang0);
        const x1 = cx + RR*Math.cos(ang1), y1 = cy + RR*Math.sin(ang1);
        const large = frac > 0.5 ? 1 : 0;
        path = '<path d="M ' + cx + ' ' + cy + ' L ' + x0.toFixed(1) + ' ' + y0.toFixed(1) + ' A ' + RR + ' ' + RR + ' 0 ' + large + ' 1 ' + x1.toFixed(1) + ' ' + y1.toFixed(1) + ' Z" fill="' + PAL[i % PAL.length] + '" opacity="0.85"><title>' + x.nome + ': ' + (frac*100).toFixed(1).replace(".", ",") + '%</title></path>';
      }
      ang0 = ang1;
      return { path, leg: '<tr><td><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:' + PAL[i % PAL.length] + ';margin-right:6px"></span>' + x.nome + '</td><td style="text-align:right">' + eur(x.v) + '</td><td style="text-align:right"><b>' + (frac*100).toFixed(1).replace(".", ",") + '%</b></td></tr>' };
    });
    const variazione = serie.length > 1 ? ((serie[serie.length-1].v - serie[0].v) / serie[0].v * 100) : 0;
    return '<span class="back" onclick="go(\'ricetta\',' + r.id + ')">← Torna alla ricetta</span>' +
      '<h1>Analisi food cost · ' + p.nome + '</h1>' +
      '<p class="sub">Costo attuale: <b>' + eur(costoUnita(r.prod)) + '/' + p.um + '</b> · variazione dall\'inizio dello storico: <b style="color:' + (variazione > 0 ? "var(--red)" : "var(--green)") + '">' + (variazione > 0 ? "+" : "") + variazione.toFixed(1).replace(".", ",") + '%</b></p>' +
      '<div class="detail-grid">' +
      '<div class="card"><h2>📈 Andamento costo unitario nel tempo</h2>' +
      (serie.length > 1
        ? '<svg viewBox="0 0 ' + W + ' ' + H + '" style="width:100%">' +
          '<line x1="' + PAD + '" y1="' + (H-PAD) + '" x2="' + (W-PAD) + '" y2="' + (H-PAD) + '" stroke="var(--line)"/>' +
          '<text x="' + PAD + '" y="' + (y(vmax)-6) + '" font-size="10" fill="var(--muted)">' + eur(vmax) + '</text>' +
          '<text x="' + PAD + '" y="' + (y(vmin)+14) + '" font-size="10" fill="var(--muted)">' + eur(vmin) + '</text>' +
          '<polyline points="' + pts + '" fill="none" stroke="var(--brand)" stroke-width="2.5"/>' + dots +
          '<text x="' + PAD + '" y="' + (H-8) + '" font-size="10" fill="var(--muted)">' + serie[0].d + '</text>' +
          '<text x="' + (W-PAD-70) + '" y="' + (H-8) + '" font-size="10" fill="var(--muted)">' + serie[serie.length-1].d + '</text>' +
          '</svg>'
        : '<p style="color:var(--muted)">Servono almeno due registrazioni di prezzo per tracciare l\'andamento.</p>') +
      '<div class="hint" style="margin:12px 0 0">Ogni punto ricalcola il costo con i prezzi degli ingredienti a quella data (passando il mouse vedi data e valore). Lo storico nasce dagli arrivi registrati.</div></div>' +
      '<div class="card"><h2>🥧 Incidenza ingredienti sul costo</h2>' +
      '<div style="display:flex;gap:20px;align-items:center;flex-wrap:wrap">' +
      '<svg viewBox="0 0 180 180" style="width:180px;flex-shrink:0"><circle cx="90" cy="90" r="70" fill="#f1f5f9"/>' + arcs.map(a=>a.path).join("") + '</svg>' +
      '<div style="flex:1;min-width:220px"><table><tr><th>Ingrediente</th><th style="text-align:right">Costo</th><th style="text-align:right">%</th></tr>' + arcs.map(a=>a.leg).join("") + '</table></div>' +
      '</div></div>' +
      '</div>';
  }},

      '<div><label>Quantità</label><input placeholder="es. 5 kg"></div>' +
      '<div><label>Data arrivo <span class="req">*</span></label><input type="date" value="2026-11-12"></div>' +
      '<div><label>Data scadenza <span class="req">*</span></label><input type="date"></div>' +
      '<div><label>Prezzo unitario <span class="opt">(€ per ' + 'unità)</span></label><input placeholder="es. 3,20"></div>' +
      '<div><label>IVA <span class="opt">(%)</span></label><select style="width:100%"><option>4</option><option selected>10</option><option>22</option></select></div>' +
      '<div class="full"><div class="hint" style="margin-bottom:0">Totale e totale con IVA calcolati automaticamente dalla quantità e dal prezzo: <b>16,00 € + IVA → 16,64 €</b></div></div>' +
      '<div class="full"><label>Documenti <span class="opt">(opzionali)</span></label>' +
      '<button class="btn sec" title="Apre la finestra di Windows per cercare e confermare il file: viene salvato il percorso" onclick="docMsg = \'📎 Selezione file... (nel backend: finestra di Windows, si conferma e si salva la path)\'; render()">📎 Allega DDT / certificato / foto</button>' +
      '<span style="color:var(--muted);margin-left:10px">oppure</span>' +
      '<input placeholder="Riferimento cartaceo (es. faldone 2026, pag. 12)" style="margin-top:8px;width:60%"></div>' +
      '</div></div>' +
      '<button class="btn" onclick="go(\'arrivi\')">Salva arrivo</button>';
  }},

  nuovaProduzione: { label: null, render: () => {
    // FLUSSO GUIDATO DALLA RICETTA: selezionato il prodotto (default: crema
    // pasticcera, che ha ricetta), l'app mostra le righe della ricetta e per
    // ogni riga propone i lotti disponibili di quell'ingrediente, già spuntati
    // se è l'unico lotto. L'utente al massimo corregge, non sceglie da zero.
    const prodSel = 4; // prodotto selezionato nella demo (crema pasticcera)
    const ric = R(prodSel);
    // Per ogni riga di ricetta: FEFO assegna da solo i lotti (partendo da quello
    // che scade prima); "✏️ cambia lotti" apre la modalità manuale con typeahead.
    // Le quantità richieste restano modificabili inline (solo per questa produzione).
    const righeRicetta = ric ? ric.righe.map((l, ix) => {
      return '<div style="border-bottom:1px solid var(--line);padding:10px 0;margin-bottom:8px">' +
        '<div class="check-row" style="border:none;padding:0;margin-bottom:6px;justify-content:flex-start">' +
        '<input value="' + l.q + '" style="width:70px;text-align:right" title="Quantità: modificabile solo per questa produzione">' +
        '<b>' + P(l.p).nome + '</b>' +
        '<span class="badge b-gray">' + P(l.p).um + '</span>' +
        '<span style="color:var(--muted);font-size:11px">da ricetta: ' + l.q + '</span>' +
        (P(l.p).tipo !== "ingrediente" ? ' ' + famBadge(P(l.p)) : '') +
        '<button class="btn sec" style="padding:3px 7px;font-size:11px;color:var(--red);border-color:var(--red);margin-left:auto" title="Escludi questa riga solo per questa produzione">✕</button>' +
        '</div>' + renderLotti(l.p, l.q, "r" + ix) + '</div>';
    }).join("") : "";
    // Righe AGGIUNTE per questa produzione (fuori ricetta): "aggiunte" con il
    // pulsante "+ Aggiungi ingrediente". Come le variazioni, valgono solo qui.
    // Lo stato 'agg' (in fondo allo script) tiene l'ingrediente scelto per ogni
    // riga: alla selezione compaiono i lotti disponibili da spuntare.
    const giaInRicetta = ric ? ric.righe.map(l=>l.p) : [];
    const righeAggiunte = agg.map((r, i) => {
      return '<div style="border:1px dashed var(--amber);border-radius:8px;padding:10px;margin-bottom:8px;background:var(--amber-bg)">' +
        '<div class="check-row" style="border:none;padding:0;margin-bottom:6px;justify-content:flex-start">' +
        '<div style="flex:1">' + renderCombo("agg" + i, "— scegli ingrediente —", "ingrediente", { sel: r.prod, onPick: "pickAgg", onQuery: "queryAgg" }) + '</div>' +
        '<input value="0,5" style="width:70px;text-align:right" title="Quantità">' +
        '<span class="badge b-amber">aggiunta</span>' +
        '<button class="btn sec" style="padding:3px 7px;font-size:11px;color:var(--red);border-color:var(--red)" onclick="remAgg(' + i + ')" title="Rimuovi aggiunta">✕</button>' +
        '</div>' +
        (r.prod ? renderLotti(r.prod, 0.5, "a" + i) : "<p style='color:var(--muted);font-size:12px;margin:0'>Seleziona un ingrediente: l'assegnazione FEFO dei lotti comparirà qui.</p>") + '</div>';
    }).join("");
    return '<span class="back" onclick="go(\'produzioni\')">← Torna alle produzioni</span>' +
      '<h1>Nuova produzione interna</h1><p class="sub">Crea un lotto interno: la ricetta propone già i lotti da consumare</p>' +
      '<div class="steps"><span class="step on">1. Prodotto</span><span class="step on">2. Lotti usati</span><span class="step">3. Conferma</span></div>' +
      '<div class="detail-grid">' +
      '<div class="card"><h2>Prodotto in produzione</h2>' +
      '<label>Prodotto <span class="req">*</span></label>' +
      renderCombo("np-prod", "Cerca prodotto (nome o sigla)...", "lavorati", { sel: prodSel }) +
      // FAMIGLIA: proposta dalla ricetta (master) ma modificabile SOLO per
      // questa produzione: è la regola "ricetta master, produzione slave".
      // La produzione registra la sua famiglia; la ricetta resta intatta.
      '<div style="margin-top:12px"><label>Famiglia di questa produzione</label>' +
      renderFamSel("npf", ric ? ric.fam : "Creme") +
      (ric ? '<div class="hint" style="margin:8px 0 0">Proposta dalla ricetta (' + ric.fam + '): cambiarla vale <b>solo per questa produzione</b>, la ricetta master non viene toccata.</div>' : '') +
      '</div>' +
      (ric
        ? '<div class="hint" style="margin-top:12px">👩‍🍳 Ricetta <b>' + P(ric.prod).nome + '</b> caricata automaticamente · resa: ' + ric.resa + ' · ' + ric.righe.length + ' ingredienti</div>' +
          '<div class="hint" style="margin-top:8px;background:var(--amber-bg);border-color:#fcd34d;color:var(--amber)">✏️ Le quantità a destra sono modificabili: le variazioni valgono <b>solo per questa produzione</b> e la ricetta salvata resta invariata.</div>'
        : '<div class="hint" style="margin-top:12px">⚠ Nessuna ricetta per questo prodotto: i lotti vanno selezionati a mano</div>') +
      '<div class="form-grid" style="margin-top:4px">' +
      '<div><label>Data produzione</label><input type="date" value="2026-11-12"></div>' +
      '<div><label>Scadenza <span class="req">*</span></label><input type="date"></div></div></div>' +
      '<div class="card"><div class="card-head" style="margin-bottom:0"><h2>Lotti consumati</h2>' +
      '<button class="btn sec" style="padding:5px 10px;font-size:12px" onclick="addRiga()">+ Aggiungi ingrediente</button></div>' +
      '<div style="color:var(--muted);font-size:11px;margin-bottom:10px">secondo ricetta · le modifiche valgono solo per questa produzione</div>' +
      '<div class="scroll-list" style="padding:10px">' + righeRicetta + righeAggiunte + '</div></div>' +
      '</div>' +
      '<div style="margin-top:8px"><button class="btn" onclick="go(\'produzioni\')">✓ Conferma produzione</button></div>';
  }},

  // Dettaglio lotto: kind 'i' = ingresso, 'n' = interno. Mostra la tracciabilità nei due sensi.
  dettaglio: { label: null, render: (_, kind, id) => {
    const isIn = kind === "i";
    const lotto = isIn ? ingressi.find(x=>x.id==id) : interni.find(x=>x.id==id);
    if (!lotto) return "<p>Lotto non trovato</p>";
    // "Usato in": lotti interni che consumano questo lotto (tramite la tabella consumi)
    const usatoIn = consumi.filter(c=>c.orig===(isIn?"ingresso":"interno") && c.from==id)
      .map(c => interni.find(n=>n.id===c.interno));
    // "Deriva da": solo per i lotti interni, i lotti che hanno consumato
    const derivaDa = isIn ? [] : consumi.filter(c=>c.interno==id);
    const back = isIn ? "arrivi" : "produzioni";
    const derivaHtml = isIn
      ? "<p style='color:var(--muted);font-size:13px'>Lotto in ingresso: origine diretta dal fornitore.</p>"
      : derivaDa.map(c => { const src = c.orig==="ingresso" ? ingressi.find(x=>x.id===c.from) : interni.find(x=>x.id===c.from);
          return '<div class="check-row click" onclick="go(\'dettaglio\',\'' + (c.orig==="ingresso" ? "i" : "n") + '\',' + c.from + ')">→ <b>' + P(src.prod).nome + '</b> · <span class="mono">' + src.lotto + '</span> <span style="color:var(--muted)">(' + c.qta + ')</span></div>';
        }).join("") || "<p style='color:var(--muted)'>nessuna origine</p>";
    const usatoHtml = usatoIn.map(n => '<div class="check-row click" onclick="go(\'dettaglio\',\'n\',' + n.id + ')">→ <b>' + P(n.prod).nome + '</b> · <span class="mono">' + n.lotto + '</span></div>').join("") || "<p style='color:var(--muted)'>non ancora utilizzato</p>";
    const docHtml = isIn
      ? (lotto.allegati.length
          ? lotto.allegati.map(a=>'<div class="badge b-green" style="cursor:pointer" title="Clic: apre il documento" onclick="apriDoc(' + lotto.id + ')">📄 ' + a + '</div>').join(" ")
          : (lotto.cartaceo ? '<span class="badge b-gray">' + lotto.cartaceo + '</span>' : "<span style='color:var(--muted)'>nessuno</span>"))
      : "<span style='color:var(--muted)'>nessuno</span>";
    return '<span class="back" onclick="go(\'' + back + '\')">← Indietro</span>' +
      '<h1>' + P(lotto.prod).nome +
      ((!isIn && lotto.modificata) ? ' <span class="badge b-amber" title="' + (lotto.noteMod || "Ricetta variata per questa produzione") + '">✏️ ricetta variata</span>' : '') +
      ' <span class="mono" style="color:var(--muted);font-weight:400">' + lotto.lotto + '</span></h1>' +
      '<div class="detail-grid">' +
      '<div class="card"><h2>Dati del lotto</h2>' +
      '<div class="kv"><div class="k">Prodotto</div><div class="v">' + P(lotto.prod).nome + (isIn && brandOf(lotto) ? ' <span class="badge b-gray">🏷 ' + brandOf(lotto) + '</span>' : '') + '</div></div>' +
      '<div class="kv"><div class="k">Allergeni</div><div class="v">' + (allergeniDi(lotto.prod).length ? allergeniDi(lotto.prod).map(allergBadge).join("") : '<span style="color:var(--muted)">nessuno dichiarato</span>') + '</div></div>' +
      '<div class="kv"><div class="k">' + (isIn ? "Fornitore" : "Data produzione") + '</div><div class="v">' + (isIn ? F(lotto.forn).nome : lotto.prodData) + '</div></div>' +
      (!isIn && lotto.fam
        ? '<div class="kv"><div class="k">Famiglia di questa produzione</div><div class="v"><span class="badge b-amber">' + lotto.fam + '</span>' +
          (R(lotto.prod) && R(lotto.prod).fam !== lotto.fam ? ' <span class="badge b-amber" title="La produzione ha registrato una famiglia diversa da quella della ricetta master">✏️ diversa dalla ricetta</span>' : "") +
          '</div></div>'
        : "") +
      '<div class="kv"><div class="k">' + (isIn ? "Data arrivo" : "Tipo") + '</div><div class="v">' + (isIn ? lotto.arrivo : P(lotto.prod).tipo) + '</div></div>' +
      '<div class="kv"><div class="k">Scadenza</div><div class="v">' + scadBadge(lotto.scad) + '</div></div>' +
      (isIn
        ? '<div class="kv"><div class="k">Prezzo unitario</div><div class="v">' + eur(lotto.pu) + ' / ' + P(lotto.prod).um + '</div></div>' +
          '<div class="kv"><div class="k">Totale / con IVA</div><div class="v">' + eur(tot(lotto)) + ' + IVA ' + lotto.iva + '% = <b>' + eur(totIva(lotto)) + '</b></div></div>'
        : '') +
      '<div class="kv"><div class="k">Documenti</div><div class="v">' + docHtml + '</div></div>' +
      '<button class="btn sec" style="margin-top:10px">🥣 Nuova produzione usando questo lotto</button>' +
      (isIn ? ' <button class="btn sec" style="margin-top:10px" onclick="go(\'modificaArrivo\',' + lotto.id + ')">✏️ Modifica arrivo</button>' +
        ' <button class="btn sec" style="margin-top:10px;color:var(--red);border-color:var(--red)" onclick="delArrivo(' + lotto.id + ')" title="Elimina l\'arrivo dal registro">🗑️ Elimina</button>' : '') + '</div>' +
      (delMsg ? '<div class="hint" style="background:var(--red-bg);border-color:#fecaca;color:var(--red)">' + delMsg + '</div>' : '') +
      '<div class="card"><h2>🔗 Tracciabilità</h2>' +
      '<h2 style="margin-top:0">Deriva da</h2>' + derivaHtml +
      '<h2>Usato in</h2>' + usatoHtml + '</div></div>' +
      // ETICHETTA CALCOLATA (solo produzioni): denominazioni + allergeni in
      // un'unica funzione, ordinati per quantità decrescente. Nessun dato
      // inserito a mano: è la lettura del verbale (i consumi) per ricorsione.
      (!isIn
        ? '<div class="card" style="margin-top:16px"><h2>🏷 Etichetta ingredienti (calcolata dal verbale)</h2>' +
          etichettaHtml(lotto.id) +
          '<div class="hint" style="margin-top:12px">Calcolata dai consumi di questa produzione, per ricorsione sui lotti interni: crema e altri semilavorati vengono "aperti" e i loro ingredienti si fondono con quelli diretti (le uova non compaiono mai due volte). Se cambia la registrazione dei consumi, cambia l\'etichetta.</div></div>'
        : "");
  }},
};

/* ============================================================
   STATO DI NAVIGAZIONE E FILTRI
   ============================================================ */

// Vista corrente + parametri extra (es. tipo e id per 'dettaglio')
let current = "dashboard", params = [];
// Stato dei filtri: sopravvive al cambio pagina finché non si torna alla vista
const filtriArrivi = { testo: "", forn: 0, prod: 0, fin: "all" };
const filtriScad = { ing: "", pro: "" };
const filtriProd = { testo: "" };
const filtriAnag = { ing: "", pro: "", for: "", fam: null, famT: "" };
// Filtro famiglia sulla card Prodotti: attivato cliccando il conteggio
// nella card Famiglie; il chip "🏷 famiglia ✕" lo toglie
function setFamFilt(f) { filtriAnag.fam = f; render(); }
const filtriMag = { testo: "", cons: null };
// Filtro conservazione: chip rapidi frigo/freezer/magazzino
function setConsFM(v) { filtriMag.cons = filtriMag.cons === v ? null : v; render(); }
const filtriRic = { testo: "" };

// Dopo un re-render l'HTML è ricostruito da zero: questa funzione
// rimette il focus sulla barra di ricerca con il cursore a fine testo,
// così l'utente può continuare a digitare senza accorgersene.
function keepFocus(id) { const t = document.getElementById(id); if (t) { t.focus(); t.setSelectionRange(t.value.length, t.value.length); } }

// Setter dei filtri: ogni modifica aggiorna lo stato e rirenderizza la vista
function setF(k, v) { filtriArrivi[k] = v; render(); keepFocus("fTesto"); }
function setFS(k, v) { filtriScad[k] = v; render(); keepFocus(k === "ing" ? "fScadI" : "fScadP"); }
function setFP(v) { filtriProd.testo = v; render(); keepFocus("fProd"); }
function setFA(k, v) { filtriAnag[k] = v; render(); keepFocus(k === "ing" ? "fAnagI" : k === "pro" ? "fAnagP" : k === "famT" ? "fAnagFam" : "fAnagF"); }
function setFM(v) { filtriMag.testo = v; render(); keepFocus("fMag"); }
function setFR(v) { filtriRic.testo = v; render(); keepFocus("fRic"); }
// Aggiorna la resa desiderata della ricetta aperta e ricalcola le quantità
function setResa(id, v) { resaTarget[id] = v; render(); keepFocus("fResa"); }
// Righe ingrediente aggiunte nella nuova produzione (fuori ricetta):
// ogni riga conserva l'ingrediente scelto per mostrare i suoi lotti
let agg = [];
function addRiga() { agg.push({ prod: 0 }); render(); }
function remAgg(i) { agg.splice(i, 1); render(); }
function setAggProd(i, v) { agg[i].prod = Number(v); render(); }
// ELIMINAZIONE ARRIVO: bloccata se il lotto è già consumato da produzioni
// (la tracciabilità non può puntare a un lotto sparito). Altrimenti rimuove
// dal registro e torna alla lista arrivi.
let delMsg = null;
function delArrivo(id) {
  const usati = consumi.filter(c => c.orig === "ingresso" && c.from === id);
  if (usati.length) {
    delMsg = "❌ Impossibile eliminare: questo lotto è già consumato da " + usati.length + " produzioni. Eliminare prima le produzioni che lo usano.";
    render(); return;
  }
  ingressi = ingressi.filter(a => a.id !== id);
  delMsg = null;
  go("arrivi");
}
// Righe della NUOVA RICETTA: stesse combobox di modifica, ma stato proprio
let nrRows = [{ prod: 0 }];
// Unità di misura per la RESA delle ricette, raggruppate per tipo.
// Massa e volume coprono le creme e gli impasti; teglie/vasetti/porzioni
// sono le misure "da laboratorio" che i pasticceri usano davvero.
const UM_RESA = [["Massa", ["g", "kg"]], ["Volume", ["ml", "lt"]], ["Laboratorio", ["teglie", "vasetti", "porzioni", "pz"]]];
function renderUmResa(sel) {
  return '<select style="flex:1">' + UM_RESA.map(([g, arr]) =>
    '<optgroup label="' + g + '">' + arr.map(u =>
      '<option value="' + u + '"' + (u === sel ? " selected" : "") + '>' + u + '</option>').join("") + '</optgroup>').join("") + '</select>';
}
function addNrRow() { nrRows.push({ prod: 0 }); render(); }
function remNrRow(i) { nrRows.splice(i, 1); render(); }
function pickNr(key, id) { const i = Number(key.slice(5)); nrRows[i] = { prod: id }; comboState[key] = { q: "", sel: id, open: false }; render(); }
function queryNr(key, v) { comboState[key] = { ...(comboState[key]||{}), q: v, open: true }; render(); keepFocus("cb-" + key); }
// Righe AGGIUNTE in modifica ricetta (le righe originali restano al loro posto)
let mrRows = [];
function addMrRow() { mrRows.push({ prod: 0 }); render(); }
function remMrRow(i) { mrRows.splice(i, 1); render(); }
function pickMr(key, id) { const i = Number(key.slice(5)); mrRows[i] = { prod: id }; comboState[key] = { q: "", sel: id, open: false }; render(); }
function queryMr(key, v) { comboState[key] = { ...(comboState[key]||{}), q: v, open: true }; render(); keepFocus("cb-" + key); }

// Navigazione: cambia vista (con eventuali parametri) e ridisegna tutto.
// Ogni spostamento salva nella cronologia la vista di partenza, così il
// pulsante "← Indietro" riporta sempre da dove si è arrivati, anche nei
// salti incrociati (es. da ricetta → anagrafica ingrediente).
let history = [];
function go(view) {
  history.push({ view: current, params: params.slice() });
  if (history.length > 30) history.shift(); // cronologia limitata
  current = view;
  params = Array.prototype.slice.call(arguments, 1);
  render();
}
// Torna alla vista precedente (se esiste); in dashboard non fa nulla
function back() {
  if (!history.length) return;
  const prev = history.pop();
  current = prev.view;
  params = prev.params;
  render();
}

// Render principale: costruisce il menu laterale (solo le viste con label)
// e inietta l'HTML della vista corrente nel contenuto.
// Ogni pagina tranne la Dashboard ha il pulsante universale "← Indietro".
function render() {
  const nav = Object.entries(views).filter(v=>v[1].label)
    .map(v=>'<button class="' + (current===v[0] ? "active" : "") + '" onclick="go(\'' + v[0] + '\')">' + v[1].label + '</button>').join("");
  document.getElementById("nav").innerHTML = nav;
  const canBack = current !== "dashboard" && history.length > 0;
  document.getElementById("main").innerHTML =
    (docMsg ? '<div class="hint" style="background:var(--green-bg);border-color:#a7f3d0;color:var(--green);margin-bottom:12px">' + docMsg + '</div>' : "") +
    (canBack ? '<span class="back" onclick="back()" style="font-weight:600;margin-bottom:16px">← Indietro</span><br>' : "") +
    views[current].render(null, ...params);
}
render();
</script>
